[package]
name = "nulltweaker"
version = "0.1.0"
description = "NullTweaker — твикер и деблоат для Windows 10/11"
authors = ["NullTweaker"]
edition = "2021"

[lib]
name = "nulltweaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
